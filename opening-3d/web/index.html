<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SILM | Estudo de abertura 3D (não homologado)</title>
<style>
:root{color-scheme:light;--paper:#f2f1ec;--ink:#252b30}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;outline:none}
.overlay{position:absolute;z-index:2;bottom:7%;left:50%;width:min(95vw,700px);transform:translateX(-50%);text-align:center;pointer-events:none}
h1{font-size:clamp(2.8rem,9vw,4.5rem);font-weight:600;letter-spacing:.2em;margin:.2rem; color:#8e650e}
p{margin:.3rem 0;font-size:clamp(.9rem,2vw,1.1rem)}
small{color:#697078}
.controls{position:absolute;z-index:3;top:16px;left:16px;display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100% - 32px)}
button{font:inherit;padding:10px 14px;border-radius:9px;border:1px solid #997e47;background:#fffdf6;color:#252b30;cursor:pointer}
button:focus-visible{outline:3px solid #246cb4;outline-offset:3px}
#state{position:absolute;z-index:3;bottom:12px;left:16px;font-size:.8rem;max-width:90vw}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Estudo tridimensional do símbolo metálico SILM"></canvas>
<div class="controls" role="group" aria-label="Controles da animação">
<button id="restart" type="button">Reproduzir</button>
<button id="skip" type="button">Ir ao símbolo final</button>
<button id="orbit" type="button">Alternar rotação da câmera</button>
</div>
<div class="overlay"><h1>SILM</h1><p>Simulador Interativo de Ligações Metálicas</p><small>A Arquitetura dos Metais</small></div>
<div id="state" role="status" aria-live="polite">Preparando estudo 3D...</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
