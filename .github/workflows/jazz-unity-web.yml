name: Jazz e Metais | Unity Web POC

on:
  workflow_dispatch:
  push:
    branches:
      - feature/baile-eletrons-jazz-1925
    paths:
      - 'jazz-club/unity/**'
      - '.github/workflows/jazz-unity-web.yml'

permissions:
  contents: read

concurrency:
  group: jazz-unity-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webgl:
    name: Compilar Unity para navegador
    # Ative a variável de repositório JAZZ_UNITY_ENABLE=true somente após configurar
    # as credenciais de licença. Sem isso, o job fica ignorado e não falha.
    if: ${{ vars.JAZZ_UNITY_ENABLE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout do branch de testes
        uses: actions/checkout@v4

      - name: Verificar projeto Unity
        shell: bash
        run: |
          test -f jazz-club/unity/ProjectSettings/ProjectVersion.txt
          test -f jazz-club/unity/Packages/manifest.json
          test -f jazz-club/unity/Assets/Editor/JazzBuild.cs
          test -f jazz-club/unity/Assets/Scripts/JazzScene.cs

      - name: Cache de bibliotecas Unity
        uses: actions/cache@v4
        with:
          path: jazz-club/unity/Library
          key: jazz-unity-web-${{ hashFiles('jazz-club/unity/Assets/**', 'jazz-club/unity/Packages/**', 'jazz-club/unity/ProjectSettings/**') }}
          restore-keys: |
            jazz-unity-web-

      - name: Compilar WebGL com GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: jazz-club/unity
          unityVersion: auto
          targetPlatform: WebGL
          buildMethod: JazzBuild.BuildWebGL
          versioning: None

      - name: Verificar artefato WebGL
        shell: bash
        run: |
          test -f build/WebGL/JazzClub/index.html
          test -d build/WebGL/JazzClub/Build

      - name: Exportar protótipo para teste
        uses: actions/upload-artifact@v4
        with:
          name: Jazz-e-Metais-Unity-WebGL-${{ github.run_number }}
          path: build/WebGL/JazzClub/
          if-no-files-found: error
          retention-days: 14
