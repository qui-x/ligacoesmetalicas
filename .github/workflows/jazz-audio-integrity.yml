name: SILM Jazz | Integridade dos arquivos completos
on:
  push:
    branches: [main]
    paths:
      - 'jazz-club/audio/**'
      - 'jazz-club/src/builtin-track.js'
      - 'jazz-club/tests/audio-integrity.test.mjs'
      - '.github/workflows/jazz-audio-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check jazz-club/src/builtin-track.js
          node --check jazz-club/src/dance.js
          node --check jazz-club/src/dance-fallback.js
      - name: Conferir os 120 arquivos musicais e SHA-256
        run: node --test jazz-club/tests/audio-integrity.test.mjs
      - name: Verificar decodificação direta do MP3 da faixa 01
        run: ffmpeg -nostdin -v error -i "jazz-club/audio/jazz e metais/faixas/01/01_O_Baile_dos_Eletrons_v02.mp3" -f null -
