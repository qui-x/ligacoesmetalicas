name: SILM — Roteiros Experimentais com estrutura SIAB

on:
  pull_request:
    paths:
      - 'domain/silm/routes.js'
      - 'domain/silm/route-session.js'
      - 'integracao/unified-ui.js'
      - 'integracao/durable-storage.js'
      - '.github/scripts/test_session_continuity_contracts.js'
      - '.github/scripts/test_session_continuity_parity.py'
      - 'domain/silm/teacher-activities.js'
      - 'integracao/teacher-ui.js'
      - '.github/scripts/test_teacher_pedagogy_contracts.js'
      - '.github/scripts/test_teacher_pedagogy_parity.py'
      - 'integracao/route-ui.js'
      - 'domain/silm/report-modules.js'
      - 'domain/silm/report-property-history.js'
      - '.github/scripts/test_report_property_history_contracts.js'
      - 'integracao/adapter.js'
      - '.github/scripts/test_report_modules_contracts.js'
      - 'index.html'
      - 'integracao/action-icons.js'
      - 'integracao/workspace-family.js'
      - '.github/scripts/test_metallic_icon_semantics.js'
      - 'integracao/integration.css'
      - 'sw.js'
      - '.github/scripts/test_route_studies_contracts.js'
      - '.github/scripts/test_routes_siab_parity.py'
      - '.github/workflows/silm-routes-siab-parity.yml'
  push:
    branches: [main]
    paths:
      - 'domain/silm/routes.js'
      - 'domain/silm/route-session.js'
      - 'integracao/unified-ui.js'
      - 'integracao/durable-storage.js'
      - '.github/scripts/test_session_continuity_contracts.js'
      - '.github/scripts/test_session_continuity_parity.py'
      - 'domain/silm/teacher-activities.js'
      - 'integracao/teacher-ui.js'
      - 'integracao/route-ui.js'
      - 'domain/silm/report-modules.js'
      - 'domain/silm/report-property-history.js'
      - '.github/scripts/test_report_property_history_contracts.js'
      - 'integracao/adapter.js'
      - '.github/scripts/test_report_modules_contracts.js'
      - 'index.html'
      - 'integracao/action-icons.js'
      - 'integracao/workspace-family.js'
      - '.github/scripts/test_metallic_icon_semantics.js'
      - 'integracao/integration.css'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Catálogo e integridade científica
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Auditar 26 roteiros e elegibilidade dos 65 metais
        run: node .github/scripts/test_route_studies_contracts.js
      - name: Auditar paridade dos materiais docentes
        run: node .github/scripts/test_teacher_pedagogy_contracts.js
      - name: Auditar retomada e migração de sessões
        run: node .github/scripts/test_session_continuity_contracts.js
      - name: Auditar exclusividade dos relatórios por módulo
        run: node .github/scripts/test_report_modules_contracts.js
      - name: Auditar eventos de propriedades no histórico e Caderno
        run: node .github/scripts/test_report_property_history_contracts.js
      - name: Auditar semântica dos ícones metálicos e identidade do relatório
        run: node .github/scripts/test_metallic_icon_semantics.js

  playwright:
    name: Roteiros / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Servir SILM em localhost
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/silm-routes-http.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/', timeout=1)
                  break
              except OSError:
                  time.sleep(.3)
          else:
              raise SystemExit('Servidor não iniciou')
          PY
      - name: Testar catálogos, hipótese, montagem e relatório
        run: python .github/scripts/test_routes_siab_parity.py --browser ${{ matrix.browser }}
      - name: Conferir professor e aluno em todas as resoluções
        run: python .github/scripts/test_teacher_pedagogy_parity.py --browser ${{ matrix.browser }}
      - name: Conferir Caderno, relatório e retomada do aluno
        run: python .github/scripts/test_session_continuity_parity.py --browser ${{ matrix.browser }}
      - name: Capturas para conferência visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roteiros-siab-${{ matrix.browser }}
          path: artifacts/roteiros-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Diagnóstico em falha
        if: failure()
        run: tail -n 100 /tmp/silm-routes-http.log || true
