name: SILM — Auditoria permanente de responsividade

# Sem filtro de paths: TODO commit na main passa pela matriz de telas.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silm-responsive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integridade:
    name: Contratos científicos e interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter versão do SILM
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe dos contratos
        run: |
          node --check tests/interface-safety.test.mjs
          node --check tests/run-cross-regressions.mjs
      - name: Verificar contratos estáticos e motores científicos
        run: node --test tests/*.test.*

  responsividade:
    name: Responsividade / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    env:
      BROWSER_NAME: ${{ matrix.browser }}
      BASE_URL: http://127.0.0.1:8765

    steps:
      - name: Obter versão do SILM
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verificar sintaxe da auditoria
        run: |
          node --check tests/run-responsive-audit.mjs
          node --check tests/run-periodic-responsive.mjs
          node --check tests/run-promethium-structure.mjs
          node --check tests/run-ga-in-u-structure.mjs
          node --check tests/run-cm-bk-cf-es-structure.mjs
          node --check tests/run-francium-computed.mjs
          node --check tests/run-fm-md-no-model.mjs
          node --check tests/run-rf-dft-structure.mjs
          node --check tests/run-lr-empirical-bcc.mjs
          node --check tests/run-fe-nist-evidence.mjs
          node --check domain/silm/research-evidence-panel.js
          node --check tests/run-multistage-evidence.mjs
          node --check domain/silm/data/research-evidence-stage65.js
          node --check tests/run-stage65-mechanical-evidence.mjs
          node --check domain/silm/data/research-compression-stage73.js
          node --check tests/run-stage73-compression.mjs
          node --check domain/silm/data/research-optical-candidates-stage65.js
          node --check domain/silm/research-optical-candidates-panel.js
          node --check tests/run-optical-candidates-stage65.mjs
          node --check domain/silm/data/optical-source-audit-registry.js
          node --check domain/silm/data/optical-source-audit-part1.js
          node --check domain/silm/data/optical-source-audit-part2.js
          node --check domain/silm/data/optical-source-audit-part3.js
          node --check domain/silm/data/optical-source-audit-part4.js
          node --check tests/run-optical-original-yaml-audit-30.mjs
          node --check domain/silm/data/material-profile-tc-experimental-1988.js
          node --check tests/run-tc-optical-conditional.mjs
          node --check domain/silm/data/research-thermal-nist-295k.js
          node --check tests/run-thermal-nist-295k.mjs
          node --check domain/silm/data/research-electrical-icepoint.js
          node --check domain/silm/research-electrical-panel.js
          node --check tests/run-electrical-icepoint.mjs
          node --check domain/silm/data/research-electrical-intrinsic-pgm.js
          node --check domain/silm/research-electrical-intrinsic-panel.js
          node --check tests/run-pgm-intrinsic.mjs
          node --check tests/run-four-scales-responsive.mjs
          node --check tests/run-cross-regressions.mjs
          node --check tests/run-controls-responsive-matrix.mjs
          node --check domain/silm/periodic-table.js

      - name: Instalar Playwright no runner
        run: |
          npm install --prefix "$RUNNER_TEMP/silm-playwright" --no-audit --no-fund playwright@1.64.1
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/silm-playwright/node_modules/playwright" >> "$GITHUB_ENV"

      - name: Preparar navegador
        run: |
          "$RUNNER_TEMP/silm-playwright/node_modules/.bin/playwright" install --with-deps "$BROWSER_NAME"

      - name: Abrir servidor local do SILM
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/silm-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/silm-http.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$BASE_URL/index.html" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/silm-http.log"
          exit 1

      - name: Validar 118 elementos, alvos de toque e rolagem confinada
        run: node tests/run-periodic-responsive.mjs

      - name: Verificar entrada estrutural de Pm e ausência de propriedades inventadas
        run: node tests/run-promethium-structure.mjs

      - name: Validar exploração de Ga In U na Rede e Célula Unitária
        run: node tests/run-ga-in-u-structure.mjs

      - name: Verificar Cm Bk Cf Es em Rede e Centro Metálico
        run: node tests/run-cm-bk-cf-es-structure.mjs

      - name: Validar Frâncio computacional na Rede e Centro Metálico
        run: node tests/run-francium-computed.mjs

      - name: Auditar estimativas geométricas de Fm Md No nas escalas 3 e 4
        run: node tests/run-fm-md-no-model.mjs

      - name: Homologar visualização HC computacional de Rf na Rede e Centro
        run: node tests/run-rf-dft-structure.mjs

      - name: Auditar hipótese CCC geométrica de Lr sem liberação de Db Sg
        run: node tests/run-lr-empirical-bcc.mjs

      - name: Verificar dados documentais Fe no modulo Explorar Ductilidade
        run: node tests/run-fe-nist-evidence.mjs

      - name: Verificar referencias multi-etapa na Ductilidade e Compressao
        run: node tests/run-multistage-evidence.mjs

      - name: Verificar Bi Pu Lu Co e transcricoes Th em Explorar (Etapa 65)
        run: node tests/run-stage65-mechanical-evidence.mjs

      - name: Verificar compressao documental Etapa 73 no Explorar
        run: node tests/run-stage73-compression.mjs

      - name: Validar 59 candidatos R550 no controle Brilho sem parametrizar motor
        run: node tests/run-optical-candidates-stage65.mjs

      - name: Validar 30 datasets YAML e metadados de origem do Brilho
        run: node tests/run-optical-original-yaml-audit-30.mjs

      - name: Verificar n k condicionais de Tc e canais de Cu no Brilho Metalico
        run: node tests/run-tc-optical-conditional.mjs

      - name: Verificar dados termicos NIST a 295 K sem extrapolar CNTP
        run: node tests/run-thermal-nist-295k.mjs

      - name: Validar referencias eletricas 273,15 K e comparacao de amostras
        run: node tests/run-electrical-icepoint.mjs

      - name: Validar curva intrinseca de Ru Rh Os Ir sem extrapolar Joule
        run: node tests/run-pgm-intrinsic.mjs

      - name: Validar ocupação visual e navegação das quatro escalas
        run: node tests/run-four-scales-responsive.mjs

      - name: Verificar contratos de estado Foco/Visão geral e controles
        run: node tests/run-cross-regressions.mjs

      - name: Executar auditoria de telas, aplicações e microestruturas
        run: node tests/run-responsive-audit.mjs

      - name: Validar controles de câmera, Ver, microestrutura e nove resoluções
        run: node tests/run-controls-responsive-matrix.mjs

      - name: Publicar resumo no GitHub Actions
        if: always()
        run: |
          FILE="reports/responsividade/$BROWSER_NAME/relatorio.md"
          if [ -f "$FILE" ]; then
            cat "$FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Auditoria de $BROWSER_NAME interrompida antes de produzir relatório." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar capturas de resistividade intrinseca PGM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-intrinsic-pgm-${{ matrix.browser }}
          path: reports/pgm-intrinsic/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas eletricas NBS Matula Chi no ponto de gelo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-electrical-icepoint-${{ matrix.browser }}
          path: reports/electrical-icepoint/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Arquivar condutividade termica NIST · 295 K
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-thermal-nist-${{ matrix.browser }}
          path: reports/thermal-nist-295k/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Arquivar canais opticos Tc e Cu · fonte primaria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-tc-optical-${{ matrix.browser }}
          path: reports/tc-optical-conditional/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Arquivar capturas da auditoria dos 30 YAML ópticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-optical-source-yaml-${{ matrix.browser }}
          path: reports/optical-yaml-audit-30/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Arquivar fontes ópticas de pesquisa da Etapa 65
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-optical-candidates-${{ matrix.browser }}
          path: reports/optical-candidates-stage65/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Arquivar evidencias de compressao Etapa 73
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-compression-stage73-${{ matrix.browser }}
          path: reports/compression-stage73/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas mecanicas de pesquisa etapa 65
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-stage65-evidence-${{ matrix.browser }}
          path: reports/stage65-mechanics/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Arquivar visualizacao documental multi-etapa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-multistage-evidence-${{ matrix.browser }}
          path: reports/multistage-evidence/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas NIST Fe · ductilidade documental
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-fe-nist-evidence-${{ matrix.browser }}
          path: reports/fe-nist-evidence/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas de Lr · hipótese CCC geométrica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-lr-bcc-${{ matrix.browser }}
          path: reports/lr-empirical-bcc/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas de Rf · DFT relativística
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-rf-hcp-${{ matrix.browser }}
          path: reports/rutherfordium-dft/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas de Fm Md No · modelo geométrico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-fm-md-no-${{ matrix.browser }}
          path: reports/fm-md-no-model/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas do Frâncio computacional
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-francium-${{ matrix.browser }}
          path: reports/francium-computed/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas de Cm Bk Cf Es
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-cm-bk-cf-es-${{ matrix.browser }}
          path: reports/cm-bk-cf-es/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas de Ga In U
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-ga-in-u-${{ matrix.browser }}
          path: reports/ga-in-u/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas da estrutura de Pm (DHCP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-promethium-${{ matrix.browser }}
          path: reports/promethium/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar capturas e diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-responsividade-${{ matrix.browser }}
          path: reports/responsividade/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Guardar métricas visuais das quatro escalas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-quatro-escalas-${{ matrix.browser }}
          path: reports/quatro-escalas/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar evidências de regressões cruzadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-regressoes-${{ matrix.browser }}
          path: reports/contratos-regressao/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar auditoria visual dos controles em nove resoluções
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-controles-matriz-${{ matrix.browser }}
          path: reports/controle-matriz/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Encerrar servidor
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/silm-http.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/silm-http.pid")" 2>/dev/null || true
          fi

  portao:
    name: Portão de regressões SILM
    if: always()
    needs: [integridade, responsividade]
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear aprovação quando algum contrato falhou
        env:
          CONTRATOS: ${{ needs.integridade.result }}
          NAVEGADORES: ${{ needs.responsividade.result }}
        run: |
          echo "Contratos científicos e interface: $CONTRATOS" >> "$GITHUB_STEP_SUMMARY"
          echo "Matriz Chromium/Firefox/WebKit: $NAVEGADORES" >> "$GITHUB_STEP_SUMMARY"
          test "$CONTRATOS" = "success"
          test "$NAVEGADORES" = "success"
