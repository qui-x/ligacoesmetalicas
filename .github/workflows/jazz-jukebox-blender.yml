name: Jazz e Metais | Construir fonografo Blender 1925
on:
  push:
    branches: [main]
    paths:
      - 'jazz-club/blender/build_jukebox_1925.py'
      - '.github/workflows/jazz-jukebox-blender.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jukebox-blender-main
  cancel-in-progress: false
jobs:
  cabinet:
    name: Blender GLB · gabinete musical
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Instalar Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          blender --version | head -3
      - name: Exportar gabinete e visor reais pelo Blender
        run: |
          mkdir -p jazz-club/assets
          blender -b --factory-startup --python-exit-code 1 \
            --python jazz-club/blender/build_jukebox_1925.py \
            -- jazz-club/assets/jukebox-1925.glb
      - name: Confirmar GLB 2.0 e visor de seleção
        run: |
          python3 - <<'PY'
          import json,struct,pathlib
          f=pathlib.Path('jazz-club/assets/jukebox-1925.glb')
          raw=f.read_bytes()
          assert len(raw)>10000
          magic,version,length=struct.unpack_from('<4sII',raw,0)
          assert magic==b'glTF' and version==2 and length==len(raw)
          chunk_len,kind=struct.unpack_from('<I4s',raw,12)
          assert kind==b'JSON'
          payload=json.loads(raw[20:20+chunk_len])
          names={n.get('name') for n in payload.get('nodes',[])}
          assert 'JB_SELECTION_WINDOW_1925' in names,names
          assert 'JB_CABINET_BODY_1925' in names
          for control in ('JB_PREV_1925','JB_NEXT_1925','JB_PLAY_1925'):
            assert control in names, control+' ausente no GLB'
          assert f.with_suffix('.blend').is_file(), 'Arquivo nativo Blender ausente'
          print('BLENDER_JUKEBOX_READY',len(raw),'bytes',len(payload.get('meshes',[])),'meshes')
          PY
      - name: Entregar GLB Blender e SHA256 como artefato
        uses: actions/upload-artifact@v4
        with:
          name: jazz-fonografo-blender-1925-${{ github.run_number }}
          path: |
            jazz-club/assets/jukebox-1925.glb
            jazz-club/assets/jukebox-1925.blend
          retention-days: 20
      - name: Publicar modelo Blender para a cena da main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jazz-club/assets/jukebox-1925.glb jazz-club/assets/jukebox-1925.blend
          if git diff --cached --quiet; then
            echo 'GLB unchanged; no commit needed'
          else
            git commit -m 'build(jazz): publicar modelo Blender nativo e GLB do fonografo'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
