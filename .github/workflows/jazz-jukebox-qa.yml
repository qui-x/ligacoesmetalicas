name: Jazz e Metais | Testes da Jukebox 1925
on:
  push:
    branches: [main]
    paths:
      - 'jazz-club/index.html'
      - 'jazz-club/src/jukebox*.js'
      - 'jazz-club/src/jukebox*.css'
      - 'jazz-club/src/dance.js'
      - 'jazz-club/src/dance-fallback.js'
      - 'jazz-club/tests/jukebox-catalogue.test.mjs'
      - 'jazz-club/web/tests/jukebox-browser.mjs'
      - 'sw.js'
      - 'scripts/sw-template.js'
      - 'scripts/build-sw.cjs'
      - '.github/workflows/jazz-jukebox-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    name: Integridade das 30 faixas e JS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe dos modulos do palco
        run: |
          node --check jazz-club/src/jukebox-core.js
          node --check jazz-club/src/jukebox-library.js
          node --check jazz-club/src/jukebox-scene.js
          node --check jazz-club/src/dance.js
          node --check jazz-club/src/dance-fallback.js
          python3 -m py_compile jazz-club/blender/build_jukebox_1925.py
      - name: Validar precache do service worker
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('sw.js', 'utf8');
          const match = source.match(/const FILES=(\\[[\\s\\S]*?\\]);\\nconst local/);
          if (!match) throw new Error('Não foi possível ler FILES no sw.js');
          const files = JSON.parse(match[1]);
          const missing = files.filter(file => file !== './' && !fs.existsSync(file));
          if (missing.length) throw new Error('Arquivos ausentes no precache: ' + missing.join(', '));
          const template = fs.readFileSync('scripts/sw-template.js', 'utf8');
          const generatedVersion = source.match(/const VERSION='([^']+)'/);
          const templateVersion = template.match(/const VERSION='([^']+)'/);
          if (!generatedVersion || !templateVersion || generatedVersion[1] !== templateVersion[1])
            throw new Error('sw.js e sw-template.js usam versões de cache diferentes');
          console.log('Precache válido:', files.length, 'recursos; cache', generatedVersion[1]);
          NODE
      - name: Validar 30 faixas + 30 JSON + 288 batidas do primeiro disco
        run: node --test jazz-club/tests/jukebox-catalogue.test.mjs
  chromium:
    name: Selecionar discos no Chromium desktop e mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright do projeto
        working-directory: jazz-club/web
        run: |
          npm install --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Testar musica, busca, faixa, volume, mobile
        working-directory: jazz-club/web
        run: node tests/jukebox-browser.mjs
      - name: Evidencias graficas do Chromium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jazz-jukebox-qa-${{ github.run_number }}
          path: jazz-club/web/qa-artifacts/jazz-jukebox-1925-*.png
          if-no-files-found: warn
          retention-days: 14
