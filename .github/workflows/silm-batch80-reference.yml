name: SILM — índice documental 80 metais
on:
  pull_request:
    paths:
      - 'domain/silm/data/research-batch80.js'
      - 'domain/silm/data/science400-coverage.js'
      - 'domain/silm/science-evidence-view.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/batch80-documentary-fallback.test.cjs'
      - '.github/workflows/silm-batch80-reference.yml'
  push:
    branches: [main, 'feature/silm-batch80-reference-panel-*']
    paths:
      - 'domain/silm/data/research-batch80.js'
      - 'domain/silm/science-evidence-view.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/batch80-documentary-fallback.test.cjs'
      - '.github/workflows/silm-batch80-reference.yml'
jobs:
  documentario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe JavaScript
        run: |
          node --check domain/silm/data/research-batch80.js
          node --check domain/silm/data/science400-coverage.js
          node --check domain/silm/science-evidence-view.js
      - name: Testes de cobertura, precedencia, nao calibracao e cache offline
        run: node --test tests/batch80-documentary-fallback.test.cjs tests/silm-science400-coverage.test.cjs tests/stage80-unified-evidence.test.cjs
