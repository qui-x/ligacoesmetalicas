name: SILM — Auditoria Cu EBSD (pré-homologação)
on:
  push:
    branches:
      - design/silm-rede-ambiente-atomico-parte6
    paths:
      - 'research/microstructure/audit_copper_ebsd.py'
      - 'research/microstructure/preview_copper_grains.py'
      - 'tests/test_copper_orientation_regression.py'
      - '.github/workflows/silm-copper-ebsd-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-copper:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar dependências HDF5
        run: |
          python -m pip install --disable-pip-version-check 'h5py>=3.11,<4' 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Validar script e regras básicas
        run: |
          python -m py_compile research/microstructure/audit_copper_ebsd.py
          python research/microstructure/audit_copper_ebsd.py --self-test
          python research/microstructure/preview_copper_grains.py --self-test
      - name: Testar geometria sintética Cu (não representa amostra real)
        run: python tests/test_copper_orientation_regression.py
      - name: Conferir MD5 e metadados EBSD do Cu policristalino
        run: |
          python research/microstructure/audit_copper_ebsd.py --out "$RUNNER_TEMP/silm-cu-audit" --cache "$RUNNER_TEMP/silm-cu-raw"
      - name: Prévia exploratória de orientação e regiões (não homologada)
        run: |
          python research/microstructure/preview_copper_grains.py --input "$RUNNER_TEMP/silm-cu-raw/copper29.h5oina" --output "$RUNNER_TEMP/silm-cu-audit/copper-orientation-preview.json"
      - name: Publicar somente auditoria textual e metadados não homologados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-copper-ebsd-review-not-homologated
          path: |
            ${{ runner.temp }}/silm-cu-audit/copper-h5oina-audit.json
            ${{ runner.temp }}/silm-cu-audit/copper-h5oina-audit.md
            ${{ runner.temp }}/silm-cu-audit/copper-orientation-preview.json
          if-no-files-found: warn
          retention-days: 14
