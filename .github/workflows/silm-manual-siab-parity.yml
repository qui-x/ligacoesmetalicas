name: SILM — Paridade estrutural do Manual com SIAB

on:
  pull_request:
    paths:
      - 'integracao/unified-ui.js'
      - 'integracao/integration.css'
      - 'domain/silm/manual.js'
      - '.github/scripts/test_manual_siab_parity.py'
      - '.github/workflows/silm-manual-siab-parity.yml'
  push:
    branches: [main]
    paths:
      - 'integracao/unified-ui.js'
      - 'integracao/integration.css'
      - 'domain/silm/manual.js'
      - '.github/scripts/test_manual_siab_parity.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual:
    name: Manual SIAB / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Servir SILM em localhost
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/silm-manual-http.log 2>&1 &
          echo $! > /tmp/silm-manual-http.pid
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/', timeout=1)
                  break
              except OSError:
                  time.sleep(0.3)
          else:
              raise SystemExit('Servidor de teste não iniciou')
          PY
      - name: Testar hierarquia, busca, impressão, teclado e responsividade
        run: python .github/scripts/test_manual_siab_parity.py --browser ${{ matrix.browser }}
      - name: Capturar log do servidor se houver falha
        if: failure()
        run: tail -n 100 /tmp/silm-manual-http.log || true
