name: SILM — Lente multiescala sobre o motor real
on:
  push:
    branches:
      - design/silm-parte8-lente-travessia-20261109
  pull_request:
    branches: [main]
    paths:
      - 'domain/silm/lens.css'
      - 'domain/silm/lens-controller.js'
      - 'integracao/module-shortcuts.js'
      - 'integracao/module-shortcuts.css'
      - 'integracao/mobile-icon-fit.css'
      - 'tests/run-cross-regressions.mjs'
      - 'integracao/dock-focus.js'
      - 'tests/run-lens-integration.mjs'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/silm-lens-integration.yml'
permissions:
  contents: read
concurrency:
  group: silm-lens-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lente:
    name: Lente / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER_NAME: ${{ matrix.browser }}
      BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Conferir sintaxe e contrato offline
        run: |
          node --check domain/silm/lens-controller.js
          node --check integracao/module-shortcuts.js
          node --check integracao/dock-focus.js
          node --check tests/run-lens-integration.mjs
          node --check sw.js
          grep -q 'domain/silm/lens-controller.js' sw.js
          grep -q 'domain/silm/lens.css' sw.js
      - name: Instalar navegador do ensaio
        run: |
          npm install --prefix "$RUNNER_TEMP/silm-playwright" --no-audit --no-fund playwright@1.64.1
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/silm-playwright/node_modules/playwright" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/silm-playwright/node_modules/.bin/playwright" install --with-deps "$BROWSER_NAME"
      - name: Servidor HTTP do SILM
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/silm-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/silm-http.pid"
          for n in $(seq 1 30); do
            if curl -sf "$BASE_URL/index.html" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/silm-http.log"
          exit 1
      - name: Testar quatro escalas com lente real
        run: node tests/run-lens-integration.mjs
      - name: Guardar evidências visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silm-lente-${{ matrix.browser }}
          path: reports/lente/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Encerrar servidor
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/silm-http.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/silm-http.pid")" 2>/dev/null || true
          fi
