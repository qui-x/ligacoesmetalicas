name: SILM | Estudo da abertura Blender 3D
on:
  push:
    branches:
      - feature/abertura-3d-blender
    paths:
      - 'opening-3d/**'
      - '.github/workflows/silm-opening-blender.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silm-opening-study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-opening-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Baixar ramo experimental
        uses: actions/checkout@v4

      - name: Instalar Blender de código aberto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version | head -2

      - name: Verificar sintaxe do gerador
        run: python3 -m py_compile opening-3d/blender/build_intro.py

      - name: Gerar arquivo Blender editável e animação GLB
        run: |
          mkdir -p dist/opening-3d
          blender --background --factory-startup -t 2 \
            --python opening-3d/blender/build_intro.py -- \
            --output dist/opening-3d/silm-opening.glb \
            --blend dist/opening-3d/silm-opening.blend \
            --frames dist/opening-3d/frames --render

      - name: Codificar vídeo MP4 da renderização Blender
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 30 \
            -i dist/opening-3d/frames/SILM_%04d.png \
            -pix_fmt yuv420p -c:v libx264 -crf 21 -movflags +faststart \
            dist/opening-3d/SILM-abertura-Blender-titulo.mp4
          test -s dist/opening-3d/SILM-abertura-Blender-titulo.mp4
          cp dist/opening-3d/frames/SILM_0183.png dist/opening-3d/quadro-final.png

      - name: Validar estrutura e movimento do GLB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,json
          p=Path('dist/opening-3d/silm-opening.glb')
          data=p.read_bytes()
          assert len(data)>5000 and data[:4]==b'glTF', 'GLB inválido'
          assert struct.unpack_from('<I',data,8)[0]==len(data), 'Tamanho inconsistente'
          n,tag=struct.unpack_from('<I4s',data,12)
          assert tag==b'JSON'
          j=json.loads(data[20:20+n])
          assert j['asset']['version']=='2.0'
          names={node.get('name') for node in j['nodes']}
          required={'SILM_LOGO_MASTER','SILM_INTERNAL_CENTRE'} | {
              f'SILM_VERTEX_{i:02d}' for i in range(8)}
          assert required.issubset(names), f'Nós ausentes: {required-names}'
          assert len([name for name in names if name and name.startswith('SILM_STRUT_')])==12
          assert len([name for name in names if name and name.startswith('ELECTRON_PARTICLE_')])==3
          assert j.get('animations'), 'Não foram exportadas animações'
          assert sum(len(a.get('channels',[])) for a in j['animations'])>10
          assert Path('dist/opening-3d/silm-opening.blend').stat().st_size>5000
          print('PASS: master logo 8+1, 12 hastes, fluxo, animações e .blend')
          PY

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Montar visualizador Babylon.js, sem CDN
        run: |
          mkdir -p opening-3d/web/public/assets
          cp dist/opening-3d/silm-opening.glb opening-3d/web/public/assets/
          cd opening-3d/web
          npm install --no-fund --no-audit
          npm run build
          test -s dist/index.html
          test -s dist/assets/silm-opening.glb
          test -n "$(find dist/assets -name '*.js' -print -quit)"

      - name: Entregar versão para inspeção (não publicar main)
        uses: actions/upload-artifact@v4
        with:
          name: silm-abertura-blender-poc-${{ github.run_number }}
          path: |
            opening-3d/web/dist/**
            dist/opening-3d/silm-opening.blend
            dist/opening-3d/SILM-abertura-Blender-titulo.mp4
            dist/opening-3d/quadro-final.png
          if-no-files-found: error
          retention-days: 14
