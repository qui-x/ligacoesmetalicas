name: Jazz e Metais | Blender + Babylon.js Character POC

on:
  push:
    branches:
      - feature/baile-eletrons-jazz-1925
    paths:
      - 'jazz-club/blender/**'
      - 'jazz-club/data/scientists.json'
      - 'jazz-club/web/**'
      - '.github/workflows/jazz-blender-audience.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jazz-character-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-character-study:
    name: Gerar GLB e site de inspecao
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout do ramo de testes
        uses: actions/checkout@v4

      - name: Instalar Blender open-source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version | head -2

      - name: Validar scripts e catálogo
        run: |
          python3 -m py_compile jazz-club/blender/build_audience.py jazz-club/blender/build_sommerfeld.py jazz-club/blender/refine_sommerfeld_07.py jazz-club/blender/materials07.py jazz-club/blender/face_anatomy.py
          python3 -m unittest discover -s jazz-club/tests -p 'test_*.py' -v
          python3 - <<'PY'
          import json
          p=json.load(open('jazz-club/data/scientists.json',encoding='utf-8'))
          assert len(p['scientists'])==8
          assert len({s['id'] for s in p['scientists']})==8
          assert any(s['id']=='sommerfeld' for s in p['scientists'])
          print('Catalogo OK: 8 cientistas com Sommerfeld incluido')
          PY

      - name: Criar plateia e Sommerfeld (GLB)
        run: |
          mkdir -p dist/jazz-club/assets
          python3 jazz-club/blender/materials07.py --output dist/jazz-club/assets/materials07
          blender -b -t 2 --factory-startup --python jazz-club/blender/build_audience.py -- \
            --manifest jazz-club/data/scientists.json \
            --output dist/jazz-club/assets/scientists-proxy.glb
          blender -b -t 2 --factory-startup --python jazz-club/blender/refine_sommerfeld_06.py -- \
            --output dist/jazz-club/assets/sommerfeld-study.glb \
            --blend dist/jazz-club/assets/sommerfeld-study.blend

      - name: Verificar conteudo binario e controladores do glTF
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,json
          root=Path('dist/jazz-club/assets')
          for name in ['scientists-proxy.glb','sommerfeld-study.glb']:
              b=(root/name).read_bytes()
              assert len(b)>4000 and b[:4]==b'glTF',f'GLB invalido: {name}'
              assert struct.unpack('<I',b[8:12])[0]==len(b)
              n,tag=struct.unpack('<I4s',b[12:20])
              assert tag==b'JSON',f'Chunk JSON ausente: {name}'
              data=json.loads(b[20:20+n])
              assert data['asset']['version']=='2.0'
              if name.startswith('sommerfeld'):
                  names={node.get('name') for node in data.get('nodes',[])}
                  required={'SOMMERFELD_ROOT','HEAD_ANCHOR','SOMMERFELD_FACE_QUAD_BASE'}
                  assert required.issubset(names),f'Controladores faltando: {required-names}'
                  assert data.get('meshes'), 'Malhas nao encontradas'
                  assert any('targets' in mesh.get('primitives',[{}])[0]
                             for mesh in data.get('meshes',[]) if mesh.get('primitives')), 'Shape keys nao exportadas'
              print(f'{name}: GLB validado, {len(b)} bytes')
          PY

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar assets publicos do visualizador
        run: |
          mkdir -p jazz-club/web/public/assets
          cp dist/jazz-club/assets/sommerfeld-study.glb jazz-club/web/public/assets/
          cp dist/jazz-club/assets/scientists-proxy.glb jazz-club/web/public/assets/

      - name: Compilar visualizador Babylon.js
        working-directory: jazz-club/web
        run: |
          npm install --no-fund --no-audit
          npm run build
          test -s dist/index.html
          test -s dist/assets/sommerfeld-study.glb

      - name: Entregar arquivos para teste (sem publicar main)
        uses: actions/upload-artifact@v4
        with:
          name: jazz-e-metais-sommerfeld-poc-${{ github.run_number }}
          path: |
            jazz-club/web/dist/**
            dist/jazz-club/assets/sommerfeld-study.blend
            dist/jazz-club/assets/materials07/*.png
            jazz-club/data/scientists.json
          if-no-files-found: error
          retention-days: 14
